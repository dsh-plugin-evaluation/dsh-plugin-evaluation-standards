name: 问题报告
about: 报告标准定义、引用或校验问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿在公开 Issue 中披露 API Key、Token、密码、私有插件内容或可利用的安全细节。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: profile-version
    attributes:
      label: 涉及方案版本
      description: 请提供 profile ID、版本，以及使用的 Git tag 或 commit SHA（如适用）。
    validations:
      required: true
